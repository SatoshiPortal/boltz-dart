name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  rust-tests:
    name: Rust tests (secrets & derivation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format check
        run: cargo fmt --check
      - name: Unit tests
        run: cargo test --locked

  dart-analyze:
    name: Dart analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: dart analyze

  dart-tests:
    name: Dart tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
      - name: Build native lib
        run: bash compile.native.sh
      - name: Install dependencies
        run: flutter pub get
      - name: Diagnose native lib
        run: |
          echo "pwd: $(pwd)"
          echo "--- build/unit_test_assets ---"
          ls -la build/unit_test_assets || true
          echo "--- file ---"
          file build/unit_test_assets/libboltz.so || true
          echo "--- ldd (missing deps show as 'not found') ---"
          ldd build/unit_test_assets/libboltz.so || true
      - name: Run tests
        run: flutter test
