name: CI

env:
  RUSTUP_TOOLCHAIN: 1.100.0
  RUSTUP_AUTO_INSTALL: 0

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  rust-tests:
    name: Rust tests (secrets & derivation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format check
        run: cargo fmt --check
      - name: Unit tests
        run: cargo test --locked

  dart-analyze:
    name: Dart analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: dart analyze

  dart-tests:
    name: Dart tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
      - name: Install dependencies
        run: flutter pub get
      - name: Build native lib
        run: bash compile.native.sh
      - name: Run tests
        run: |
          ls -la rust/target/release/libboltz.so
          ldd rust/target/release/libboltz.so || true
          flutter test -r expanded
