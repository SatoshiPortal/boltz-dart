[package]
name = "boltz"
authors = [
    "i5hi <ishi@satoshiportal.com>, mocodesmo <morteza@satoshiportal.com>",
]
version = "0.1.6"
edition = "2021"

[lib]
name = "boltz"
doctest = false
crate-type = ["staticlib", "cdylib"]

[dependencies]
boltz-client = { git = "https://github.com/SatoshiPortal/boltz-rust.git", ref = "593fe8a9416a10dbc7e3d66cab93f5b5f573964e", features = ["lnurl", "electrum"] }
flutter_rust_bridge = "=2.9.0"
anyhow = "1.0.68"
serde = { version = "1.0.0", features = ["derive"] }
serde_json = "1.0.0"
openssl = { version = "0.10.64", features = ["vendored"] }
hex = "0.4"

[build-dependencies]
flutter_rust_bridge_codegen = "2.9.0"

[build]
profiler = true

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[target.'cfg(target_os = "macos")']
rustflags = [
    "-C", "link-arg=-undefined",
    "-C", "link-arg=dynamic_lookup",
]
