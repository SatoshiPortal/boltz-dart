[package]
name = "boltz"
authors = [
    "i5hi <ishi@satoshiportal.com>, mocodesmo <morteza@satoshiportal.com>",
]
version = "0.5.2"
edition = "2021"

[lib]
name = "boltz"
doctest = false
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
boltz-client = { git = "https://github.com/SatoshiPortal/boltz-rust", rev = "623d93b3c2ead4f287fc7d39e58b7a40770465da", features = ["lnurl", "electrum"] }
# Pin the rustls crypto provider to ring and install it explicitly before any
# electrum TLS connection. Both ring + aws-lc-rs can be linked transitively
# (notably in the bull_sdk aggregate), which makes rustls 0.23 abort when it
# tries to auto-pick a default provider.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
flutter_rust_bridge = "=2.12.0"
anyhow = "1.0.68"
serde = { version = "1.0.0", features = ["derive"] }
serde_json = "1.0.0"
openssl = { version = "0.10.64", features = ["vendored"] }
hex = "0.4"
reqwest = { version = "0.12", features = ["json"] }

[features]
bull_sdk = []

[build-dependencies]
flutter_rust_bridge_codegen = "=2.12.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build]
profiler = true

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[target.'cfg(target_os = "macos")']
rustflags = [
    "-C", "link-arg=-undefined",
    "-C", "link-arg=dynamic_lookup",
]
